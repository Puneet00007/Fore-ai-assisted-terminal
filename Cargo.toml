[package]
name = "fore"
version = "0.4.0"
edition = "2024"
description = "A local-first shell copilot: ghost text from your history, Ctrl-/ error fixes, English→command, pre-flight checks, undoable rm"
license = "MIT"
repository = "https://github.com/YOUR_GITHUB_USER/fore"
readme = "README.md"
keywords = ["shell", "zsh", "terminal", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[dependencies]
# Async runtime: lets the daemon handle many shell connections concurrently
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
# JSON (de)serialization for the wire protocol between shell and daemon
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Embedded SQLite. "bundled" compiles SQLite in, so there is no system dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
# Command-line argument parsing for `fore daemon`, `fore suggest`, etc.
clap = { version = "4", features = ["derive", "env"] }
# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# HTTP client for OpenAI-compatible endpoints (rustls: no OpenSSL system dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Real bash grammar so the safety classifier reasons about structure, not strings
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
# Config file (~/.config/fore/config.toml)
toml = "0.8"

[profile.release]
opt-level = 3
lto = true          # link-time optimization: smaller, faster binary
codegen-units = 1
strip = true        # strip debug symbols from the release binary
